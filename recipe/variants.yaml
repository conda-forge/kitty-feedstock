c_stdlib_version:
  - if: linux
    then: "2.28"
  - if: osx
    then: "13.0"

# Include Python 3.15 while the global conda-forge matrix stops at 3.14.
# Keep is_python_min aligned with python, as required by the global zip_keys.
python:
  - 3.11.* *_cpython
  - 3.12.* *_cpython
  - 3.13.* *_cp313
  - 3.14.* *_cp314
  - 3.15.* *_cp315
is_python_min:
  - true
  - false
  - false
  - false
  - false
