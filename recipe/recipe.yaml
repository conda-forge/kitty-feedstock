# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.50.0"
  nerd_fonts_version: "3.4.0"

package:
  name: kitty
  version: ${{ version }}

source:
  - url: https://github.com/kovidgoyal/kitty/releases/download/v${{ version }}/kitty-${{ version }}.tar.xz
    sha256: 01f20d0b253af0a7e041394a501adc83483f2eee01faf607a933c028343ab71a
    patches:
      - portable-macos-build.patch
  - url: https://raw.githubusercontent.com/ryanoasis/nerd-fonts/v${{ nerd_fonts_version }}/patched-fonts/NerdFontsSymbolsOnly/SymbolsNerdFontMono-Regular.ttf
    sha256: f0f624d9b474bea1662cf7e862d44aebe1ae1f6c7f9cb7a0ca5d0e5ac9561c60
    target_directory: fonts
  - url: https://raw.githubusercontent.com/ryanoasis/nerd-fonts/v${{ nerd_fonts_version }}/patched-fonts/NerdFontsSymbolsOnly/LICENSE
    sha256: 84a7a98c82140fb12c37fe42b93805baa16024cb3e5acc599b7ffe612c55d847
    target_directory: fonts

build:
  number: 0
  skip: win or match(python, '<3.12')

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('go-cgo') }}
    - go-licenses
    - pkgconf
    - make
    - ncurses
    - shader-slang
  host:
    - python
    - if: match(python, '>=3.15')
      then: libpython ${{ python }}
    - harfbuzz
    - zlib
    - libpng
    - imagemagick
    - pygments
    - lcms2
    - xxhash
    - simde
    - openssl
    - if: linux
      then:
        - dbus
        - xorg-libxcursor
        - xorg-libxrandr
        - xorg-libxi
        - xorg-libxinerama
        - xorg-xineramaproto
        - libglu
        - xorg-glproto
        - mesalib
        - libxkbcommon
        - freetype
        - fontconfig
        - expat
        - libcanberra
        - cairo
        - wayland
        - wayland-protocols
  run:
    - python
    - imagemagick
    - pygments
    - if: linux
      then:
        - xkeyboard-config
        - libcanberra

tests:
  - script:
      - kitty --help
      - kitten --help
  - if: osx
    then:
      package_contents:
        files:
          - Applications/kitty.app/Contents/Info.plist
          - Applications/kitty.app/Contents/Resources/kitty/shaders/graphics.spv

about:
  homepage: https://sw.kovidgoyal.net/kitty/
  license: GPL-3.0-only AND MIT
  license_file:
    - LICENSE
    - fonts/LICENSE
    - library_licenses/
  summary: A cross-platform, fast, feature full, GPU based terminal emulator
  documentation: https://sw.kovidgoyal.net/kitty/
  repository: https://github.com/kovidgoyal/kitty

extra:
  recipe-maintainers:
    - CJ-Wright
    - davidbrochart
